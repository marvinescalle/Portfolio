<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />

    <title>Marvin Escalle · IT Engineer | DevOps, Automation &amp; Data</title>
    <meta
      name="description"
      content="Portfolio de Marvin Escalle, ingénieur IT spécialisé en automatisation, DevOps, systèmes et données. Découvrez mes expériences professionnelles, projets et compétences techniques."
    />
    <meta name="author" content="Marvin Escalle" />

    <!-- Open Graph : aperçu lors du partage sur LinkedIn, Slack, Discord…
         TODO : ajouter <meta property="og:image"> une fois qu'une image de
         partage (1200×630) est déposée dans public/, et og:url une fois le
         nom de domaine en place. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Marvin Escalle" />
    <meta
      property="og:title"
      content="Marvin Escalle · IT Engineer | DevOps, Automation &amp; Data"
    />
    <meta
      property="og:description"
      content="Portfolio de Marvin Escalle, ingénieur IT spécialisé en automatisation, DevOps, systèmes et données."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Marvin Escalle · IT Engineer | DevOps, Automation &amp; Data"
    />
    <meta
      name="twitter:description"
      content="Portfolio de Marvin Escalle, ingénieur IT spécialisé en automatisation, DevOps, systèmes et données."
    />

    <!-- Le portfolio existe dans les deux langues sous la même adresse, le
         choix étant fait côté client : la balise annonce donc les deux, sans
         quoi la version anglaise reste invisible des moteurs. -->
    <meta property="og:locale:alternate" content="en_GB" />

    <!-- Favicon vectoriel, reconnu par tous les navigateurs actuels.
         TODO : ajouter un apple-touch-icon.png de 180x180 pour l'ajout à
         l'écran d'accueil sur iOS, qui n'accepte pas le SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
