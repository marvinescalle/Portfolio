[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite exige Node 20+ ; sans cette ligne Netlify peut utiliser une version
  # plus ancienne et faire échouer le build.
  NODE_VERSION = "22"

# Le portfolio est une SPA : toutes les URL doivent être servies par index.html,
# sinon un accès direct à /Projets renvoie une 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
